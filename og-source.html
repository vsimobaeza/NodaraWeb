<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  /* Fuentes locales, las MISMAS que el informe y la landing. Al regenerar la tarjeta hay que
     abrirla desde captacion/ para que `fuentes/` resuelva. */
  @font-face{font-family:'Cabinet Grotesk';src:url(fuentes/cabinet-grotesk-100-900.woff2);font-weight:100 900;font-display:block;}
  @font-face{font-family:'Satoshi';src:url(fuentes/satoshi-300-900.woff2);font-weight:300 900;font-display:block;}
  @font-face{font-family:'IBM Plex Mono';src:url(fuentes/ibm-plex-mono-400.woff2);font-weight:400;font-display:block;}
</style>
<style>
  /* Sistema v2 «La Lámina» (docs/producto.md §9) — tarjeta OG 1200×630 */
  /* TOKENS:INICIO — volcado desde el informe por 'npm run diseno -- --aplicar'. NO EDITAR A MANO.
     La autoridad es informes/plantillas/informe.plantilla.html. Lo propio de esta
     superficie va DESPUÉS de este bloque. */
  :root{
    --paper:#FFFFFF;
    --panel:#FFFFFF;
    --ink:#101522;
    --ink-soft:#5A6478;
    --ink-mute:#6B7488;
    --hair:#E6EBF2;
    --track:#EDF1F6;
    --brand:#1B3FD8;
    --brand-deep:#122E9E;
    --titulo:"Cabinet Grotesk","Segoe UI",-apple-system,Arial,sans-serif;
    --sans:"Satoshi","Segoe UI",-apple-system,Arial,sans-serif;
    --cuerpo:"Satoshi","Segoe UI",-apple-system,Arial,sans-serif;
    --mono:"IBM Plex Mono","Cascadia Code",Consolas,ui-monospace,monospace;
    --w-titulo:700;
    --w-fuerte:600;
  }
  /* TOKENS:FIN */
  :root{ --brand-wash:#E9EEFB; --brand-grid:rgba(27,63,216,.07); }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1200px;height:630px;}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overflow:hidden;position:relative;
  }

  /* hoja: marco de tinta + papel milimetrado */
  .sheet{
    position:absolute;inset:20px;border:3px solid var(--ink);
    background-color:var(--panel);
    background-image:
      linear-gradient(var(--brand-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--brand-grid) 1px, transparent 1px);
    background-size:10px 10px;
    display:flex;flex-direction:column;
  }

  /* cajetín */
  .cajetin{display:flex;align-items:stretch;border-bottom:3px solid var(--ink);background:var(--panel);}
  .cj-brand{display:flex;align-items:center;padding:18px 30px;flex:1;}
  /* ⚠️ LA TARJETA LLEVA LA MARCA DE LA LANDING, NO LA DEL INFORME (2026-09-09). Es la puerta de
     entrada a la landing: se comparte por WhatsApp o LinkedIn y el siguiente clic aterriza en
     esa pagina. Si la tarjeta enseña «Nodara» en Zodiak con isotipo y la pagina «nodara» en
     minusculas sin el, el visitante cree que se ha equivocado de sitio. El informe y el
     Registro SI conservan Zodiak y el isotipo: ahi la marca vive dentro de un documento.

     ⚠️ NO usa `--marca`. Ese token vale Zodiak y lo vuelca `npm run diseno` desde el informe;
     ponerlo aqui lo devolveria a la serifa en el primer `--aplicar`. La familia va escrita en
     la regla, igual que `--marca-landing` en la landing.

     ⚠️ 54px Y NO LOS 40 DE LA LANDING, a proposito. Esto es un poster de 1200px que WhatsApp
     enseña a un tercio de tamaño: 40px de peso Light bajarian a ~13px efectivos y el trazo fino
     se deshilacha en la miniatura, que es donde de verdad se ve esta pieza. */
  .wordmark{font-family:"Cabinet Grotesk","Segoe UI",-apple-system,Arial,sans-serif;
            font-weight:300;font-size:54px;line-height:1;letter-spacing:.04em;color:var(--ink);}
  .cj-field{border-left:2px solid var(--hair);padding:14px 26px;display:flex;flex-direction:column;justify-content:center;gap:6px;}
  .cj-k{font-family:var(--sans);font-weight:500;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);}
  .cj-v{font-family:var(--sans);font-weight:var(--w-fuerte);font-size:23px;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;}
  .cj-doc .cj-v{font-family:var(--titulo);font-weight:var(--w-titulo);letter-spacing:-.015em;}

  /* titular */
  .mid{flex:1;padding:36px 56px 0;}
  h1{
    font-family:var(--titulo);font-weight:var(--w-titulo);
    font-size:76px;line-height:1.02;letter-spacing:-.025em;max-width:740px;
  }
  h1 em{font-style:normal;color:var(--brand);}
  /* Medida corta a propósito: compite con el unifilar por el espacio y debe leerse en
     miniatura. En BANDERA, como toda la prosa del sistema — justificar está prohibido. */
  .lede{margin-top:18px;font-size:21px;line-height:1.5;color:var(--ink-soft);max-width:530px;
    text-align:left;text-wrap:pretty;}
  .lede b{color:var(--ink);font-weight:600;}

  /* unifilar (estado final: nudos encendidos en cobalto) */
  .uni{margin-top:auto;}
  .uni svg{display:block;width:100%;height:auto;}
  .u-bus{stroke:var(--brand);stroke-width:4;fill:none;}
  .u-stub{stroke:var(--brand);stroke-width:3.5;fill:none;}
  .u-j{fill:var(--brand);}
  /* Cobalto, no verde: la landing pinta el dato con la marca desde el 2026-09-09 y esta
     tarjeta es su puerta de entrada (§8.2). El informe conserva el verde. */
  .nd-ok{fill:var(--brand);stroke:#fff;stroke-width:3;}
  .nd-halo{fill:none;stroke:var(--brand);stroke-width:2;opacity:.4;}
  .nd-closed{fill:#C2CAD6;stroke:#fff;stroke-width:3;}

  /* pie: leyenda + especificaciones */
  .facts{
    display:flex;align-items:center;gap:26px;
    border-top:2px solid var(--hair);background:var(--panel);
    padding:16px 56px 18px;
  }
  .lg{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:15px;color:var(--ink-soft);}
  .lg svg{flex:none;}
  .spec{margin-left:auto;font-family:var(--sans);font-weight:var(--w-fuerte);font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);}
  .spec b{color:var(--ink);font-weight:600;}
</style>
</head>
<body>
  <div class="sheet">

    <div class="cajetin">
      <div class="cj-brand">
        <span class="wordmark">nodara</span>
      </div>
      <div class="cj-field cj-doc">
        <span class="cj-k">Documento</span>
        <span class="cj-v">Radar de Capacidad</span>
      </div>
      <div class="cj-field">
        <span class="cj-k">Periodicidad</span>
        <span class="cj-v">Mensual</span>
      </div>
      <div class="cj-field">
        <span class="cj-k">Fuente</span>
        <span class="cj-v">CNMC</span>
      </div>
    </div>

    <div class="mid">
      <h1>Dónde la red española tiene sitio, <em>cada mes</em>.</h1>
      <p class="lede">Capacidad de acceso <b>nodo a nodo</b> (CEP/CAD) y qué nodos se mueven mes a mes.
        Datos CNMC, curados.</p>
    </div>

    <div class="uni">
      <svg viewBox="0 0 1154 120" aria-hidden="true">
        <path class="u-bus" d="M0 66 H1154"/>
        <path class="u-stub" d="M280 66 V32"/>
        <path class="u-stub" d="M640 66 V98"/>
        <path class="u-stub" d="M950 66 V32"/>
        <circle class="u-j" cx="280" cy="66" r="5"/>
        <circle class="u-j" cx="640" cy="66" r="5"/>
        <circle class="u-j" cx="950" cy="66" r="5"/>
        <circle class="nd-closed" cx="90" cy="66" r="12"/>
        <rect class="nd-halo" x="257" y="9" width="46" height="46"/>
        <rect class="nd-ok" x="266" y="18" width="28" height="28"/>
        <circle class="nd-halo" cx="470" cy="66" r="23"/>
        <circle class="nd-ok" cx="470" cy="66" r="16"/>
        <circle class="nd-closed" cx="640" cy="98" r="11"/>
        <rect class="nd-closed" x="779" y="55" width="22" height="22"/>
        <circle class="nd-halo" cx="950" cy="32" r="23"/>
        <circle class="nd-ok" cx="950" cy="32" r="16"/>
        <rect class="nd-closed" x="1079" y="55" width="22" height="22"/>
      </svg>
    </div>

    <div class="facts">
      <span class="lg"><svg width="15" height="15" viewBox="0 0 15 15"><circle cx="7.5" cy="7.5" r="5" fill="none" stroke="#101522" stroke-width="2"/></svg> 220 kV</span>
      <span class="lg"><svg width="15" height="15" viewBox="0 0 15 15"><rect x="2.5" y="2.5" width="10" height="10" fill="none" stroke="#101522" stroke-width="2"/></svg> 400 kV</span>
      <span class="lg"><svg width="15" height="15" viewBox="0 0 15 15"><circle cx="7.5" cy="7.5" r="5.5" fill="#1B3FD8"/><!-- cobalto A PELO: dentro de un SVG el token no llega --></svg> admite nueva demanda</span>
      <span class="spec"><b>1</b> email / mes · Fuente <b>CNMC</b></span>
    </div>

  </div>
</body>
</html>
